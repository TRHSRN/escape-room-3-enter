<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 프로젝트 다운로드</title>
    <style>
        /* 기본 스타일: 검정 배경, 스크롤 금지 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            transition: background-color 0.1s ease-in;
        }

        /* 공통 입력창 및 버튼 스타일 */
        .custom-input {
            background-color: #111;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 5px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            margin-bottom: 15px;
            width: 80%;
            max-width: 250px;
        }

        .custom-btn {
            background-color: #00ff00;
            color: black;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #00ff00;
        }

        /* [화면 0] 비밀번호 입력 화면 스타일 */
        #password-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: #00ff00;
            padding: 20px;
            box-sizing: border-box;
        }

        #password-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #00ff00;
        }

        /* [화면 1] 다운로드 화면 스타일 (처음엔 숨김) */
        #download-screen {
            display: none;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            border: 15px solid #00ff00;
            box-sizing: border-box;
            box-shadow: 0 0 20px #00ff00;
        }

        /* 초록색 다운로드 버튼 */
        #download-button {
            padding: 20px 40px;
            font-size: 1.2rem;
            color: #00ff00;
            background-color: transparent;
            border: 3px solid #00ff00;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            text-shadow: 0 0 10px #00ff00;
            box-shadow: 0 0 15px #00ff00;
            animation: pulse 1.5s infinite;
        }

        /* [화면 2] 랜섬웨어 경고 화면 스타일 (처음엔 숨김) */
        #warning-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle, #330000 0%, #000000 100%);
        }

        #warning-text {
            font-size: 2.3rem;
            color: #ff0000;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 2px 2px #550000;
            animation: glitch 0.3s infinite;
        }

        #status-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #ddd;
        }

        /* 감염 화면 전용 붉은 입력창/버튼 */
        #warning-screen .custom-input {
            border-color: #ff0000;
            color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }
        #warning-screen .custom-btn {
            background-color: #ff0000;
            color: white;
            box-shadow: 0 0 10px #ff0000;
        }

        /* [화면 3] 엔딩 화면 스타일 (성공 / 실패 공통) */
        #ending-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #ending-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        #ending-desc {
            font-size: 1.3rem;
            line-height: 1.6;
        }

        /* 애니메이션 정의 */
        @keyframes pulse {
            0% { box-shadow: 0 0 15px #00ff00; }
            50% { box-shadow: 0 0 25px #00ff00, 0 0 10px #00ff00 inset; }
            100% { box-shadow: 0 0 15px #00ff00; }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <!-- [화면 0] 입장 비밀번호 입력 화면 -->
    <div id="password-screen">
        <h2>ENTER ACCESS CODE</h2>
        <input type="text" id="password-input" class="custom-input" placeholder="코드를 입력하세요" autocomplete="off">
        <button id="password-submit" class="custom-btn">접속</button>
    </div>

    <!-- [화면 1] 다운로드 메인 화면 -->
    <div id="download-screen">
        <button id="download-button">방탈출.exe 다운로드하기</button>
    </div>

    <!-- [화면 2] 랜섬웨어 감염 경고 + 4자리 비밀번호 입력 화면 -->
    <div id="warning-screen">
        <div id="warning-text">시스템 감염 완료!</div>
        <div id="status-text">데이터가 암호화되었습니다. 복구 코드를 입력하십시오.</div>
        
        <!-- 4자리 코드 입력란 -->
        <input type="password" id="final-code-input" class="custom-input" placeholder="4자리 코드 입력" maxlength="4" autocomplete="off">
        <button id="final-code-submit" class="custom-btn">코드 전송</button>
    </div>

    <!-- [화면 3] 엔딩 출력 화면 (성공 혹은 게임오버) -->
    <div id="ending-screen">
        <div id="ending-title">결과 타이틀</div>
        <div id="ending-desc">결과 상세 설명</div>
    </div>

    <script>
        /* ========================================================
           ★ [스태프 전용] 여기를 수정하면 비밀번호를 바꿀 수 있습니다!
        ======================================================== */
        const MAIN_PASSWORD = 'TR2026';  // 최초 입장 코드
        const SUCCESS_CODE  = '9071';    // 성공(탈출) 4자리 코드
        const TRAP_CODE     = '5136';    // 함정(게임오버) 4자리 코드
        /* ======================================================== */

        // 1. 최초 입장 비밀번호 확인
        document.getElementById('password-submit').addEventListener('click', checkPassword);
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { checkPassword(); }
        });

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            if (input.toUpperCase() === MAIN_PASSWORD.toUpperCase()) {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('download-screen').style.display = 'flex';
            } else {
                alert('잘못된 코드입니다. 다시 시도하세요.');
                document.getElementById('password-input').value = '';
            }
        }

        // 2. 다운로드 버튼 클릭 시 감염 연출
        document.getElementById('download-button').addEventListener('click', function() {
            document.getElementById('download-screen').style.display = 'none';
            document.getElementById('warning-screen').style.display = 'flex';
            document.body.style.backgroundColor = '#1a0000';
            
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 300]);
            }
        });

        // 3. 최종 4자리 코드 확인 (갈림길)
        document.getElementById('final-code-submit').addEventListener('click', checkFinalCode);
        document.getElementById('final-code-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { checkFinalCode(); }
        });

        function checkFinalCode() {
            const input = document.getElementById('final-code-input').value;
            const endingScreen = document.getElementById('ending-screen');
            const endingTitle = document.getElementById('ending-title');
            const endingDesc = document.getElementById('ending-desc');

            if (input === SUCCESS_CODE) {
                // ⭕ 0000 입력 시: 해제 성공 엔딩
                document.getElementById('warning-screen').style.display = 'none';
                endingScreen.style.display = 'flex';
                document.body.style.backgroundColor = '#001a00'; // 부드러운 초록 배경

                endingTitle.style.color = '#00ff00';
                endingTitle.innerText = '🔓 해제되었습니다!';
                endingDesc.style.color = '#ffffff';
                endingDesc.innerHTML = '축하합니다! 시스템 제한이 해제되었습니다.<br>방에서 안전하게 탈출하세요!';

            } else if (input === TRAP_CODE) {
                // ❌ 4444 입력 시: 함정 엔딩 (GAME OVER)
                document.getElementById('warning-screen').style.display = 'none';
                endingScreen.style.display = 'flex';
                document.body.style.backgroundColor = '#330000'; // 짙은 빨간 배경

                endingTitle.style.color = '#ff0000';
                endingTitle.innerText = '💥 GAME OVER';
                endingDesc.style.color = '#ff8888';
                endingDesc.innerHTML = '함정에 걸리셨습니다!<br>시스템이 영구히 격리됩니다.';

            } else {
                // 그 외 엉뚱한 번호 입력 시
                alert('올바르지 않은 코드입니다. 시스템이 반응하지 않습니다.');
                document.getElementById('final-code-input').value = '';
            }
        }
    </script>
</body>
</html>
